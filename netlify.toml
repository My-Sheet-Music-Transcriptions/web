# Several Netlify sites are built from this repository with this one file:
#   - one site per locale/domain:   NETLIFY_TARGET=site (default), SITE_LOCALE=<locale>
#     (no SITE_LOCALE: every locale under /<locale>, as on the English site until its cutover)
#   - or one site for every domain: SITE_LOCALE=multi, each domain added to the site as a domain alias;
#     SITE_HOSTS_<LOCALE> (e.g. SITE_HOSTS_ES="staging.example.es") overrides a locale's domains to try other hosts
#     (scripts/build-multi.ts, scripts/lib/host-rules.ts)
#   - the design system (Storybook): NETLIFY_TARGET=storybook
# Set those variables per site (Site configuration > Environment variables), with the secrets' decryption keys:
# DOTENV_PRIVATE_KEY_PRODUCTION (production context) and DOTENV_PRIVATE_KEY_DEVELOPMENT (deploy previews, branch
# deploys); the secrets themselves are committed encrypted in .env.production / .env.development (dotenvx).
# Deploy Previews: the English site (SITE_LOCALE=en) builds every locale under /en, /es, /ca...
# (path mode, see src/i18n/routing.ts); the other locale sites skip previews and branch deploys
# (scripts/netlify-ignore.sh), so a pull request gets one all-languages preview plus Storybook's.
[build]
  command = "pnpm build:netlify"
  publish = "dist/client"
  ignore = "sh scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--frozen-lockfile"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The CMS admin (vite.admin.config.ts): never indexed.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
