  <div data-msmt="Article" data-props='{"items": [{"body": "## 0. Avís general\n\nAquest Avís de cookies (\"Avís\") s&#39;aplica a MSMT Barcelona Music, S.L. (\"MSMT Barcelona Music, S.L.\", \"Nosaltres\", \"Nostre\"), i explica els nostres principis pel que fa a la recopilació, el processament i l&#39;emmagatzematge de la teva informació. Aquesta política explica específicament com nosaltres, els nostres socis i els usuaris dels nostres serveis implementem cookies, així com les opcions que tens per controlar-les.\n\n## 1. Informació del responsable\n\nNom de l&#39;empresa: **MSMT Barcelona Music, S.L.**\n\nCIF: **ES B67363986**\n\nAdreça: Passeig de les Lletres 13, 4t 3a; 08221, Terrassa, Barcelona, Espanya\n\nTelèfon: 678 26 23 99\n\nCorreu electrònic: [gdpr@mysheetmusictranscriptions.com](mailto:gdpr@mysheetmusictranscriptions.com)\n\nPersona de contacte: Oriol López\n\n## 2. Per a què utilitzem les cookies?\n\nFem servir les cookies següents amb les finalitats següents:\n\n**Les cookies estrictament necessàries** són necessàries perquè el nostre lloc web funcioni correctament. Aquestes cookies no recullen cap informació personal. Si tries rebutjar o desactivar les cookies estrictament necessàries, no podràs utilitzar totes les funcions del lloc web.\n\n**Les cookies de rendiment / anàlisi** s&#39;utilitzen per fer que l&#39;experiència al nostre lloc web sigui més fàcil per als visitants, i s&#39;utilitzen amb finalitats de seguretat. La informació d&#39;aquestes cookies també es fa servir amb finalitats estadístiques, com ara mantenir estadístiques sobre l&#39;ús del lloc web, fer enquestes per millorar els nostres serveis en línia i el lloc web, determinar quines parts del nostre lloc web són les més populars i optimitzar l&#39;ús del lloc web.\n\n**Les cookies publicitàries** s&#39;utilitzen per recopilar informació sobre com els visitants utilitzen el lloc web per poder oferir publicitat en altres llocs web sobre els nostres serveis.\n\n**FUNCIONALS**\n\nAquestes cookies són necessàries per a les funcions bàsiques del lloc i, per tant, sempre estan habilitades. Entre altres coses, les cookies es troben al lloc que has visitat durant una sessió. Si ho sol·licites, poden recordar-ho entre sessions.\n\n**ESTADÍSTIQUES**\n\nLes cookies d&#39;estadístiques ens ajuden a entendre com es fa servir el nostre lloc i a millorar-lo mitjançant la recopilació de dades de manera anònima.\n\n**TERCERS / CONTINGUT INCRUSTAT**\n\nFem ús de diferents aplicacions i serveis de tercers per millorar l&#39;experiència dels visitants del lloc web. Aquests inclouen plataformes de xarxes socials com Facebook, Instagram i Twitter (mitjançant l&#39;ús de botons de compartir), o contingut incrustat de YouTube. Com a resultat, aquestes cookies poden ser establertes per aquests tercers i utilitzades per ells per fer el seguiment de la teva activitat en línia. No tenim control directe sobre la informació que es recopila amb aquestes cookies.\n\n**GOOGLE ANALYTICS**\n\nUtilitzem Google Analytics per veure com els nostres visitants fan servir el nostre lloc. Les dades que guardem no es poden fer servir per identificar-te: ets completament anònim. La informació és recollida i guardada per Google.\n\n**EL QUE POTS FER PER ADMINISTRAR L&#39;ÚS DE LES COOKIES**\n\nAl teu navegador pots ajustar la configuració de les cookies. La majoria de les vegades també hi pots llegir més sobre els diferents tipus de cookies. L&#39;aspecte de la configuració varia d&#39;un navegador a un altre. Però bàsicament tots tenen configuracions que, entre altres coses, bloquegen totes les cookies, limiten l&#39;ús a les cookies pròpies o t&#39;ajuden a esborrar totes les cookies emmagatzemades al teu ordinador. És possible que alguns dels nostres serveis no funcionin si bloqueges o elimines les cookies.\n\n## 3. Poden els usuaris evitar les cookies?\n\nPots triar si vols acceptar cookies. Ajustant el navegador web evitaràs rebre cookies, i també podràs utilitzar el navegador per eliminar-les. El mètode utilitzat per bloquejar o eliminar les cookies dependrà del navegador web utilitzat. Quan triïs permetre el nostre ús de cookies, tingues en compte que recopilarem la informació tal com s&#39;indica més amunt fins que deixis de permetre&#39;n l&#39;ús.\n\nSi tens cap pregunta respecte a les teves opcions pel que fa a les cookies, posa&#39;t en contacte amb nosaltres a la informació de contacte que es detalla més amunt.\n\nPer obtenir més informació sobre com administrar i eliminar les cookies, visita [www.aboutcookies.org](http://www.aboutcookies.org). Per obtenir més detalls sobre les cookies de publicitat i com administrar-les, visita [www.youronlinechoices.eu](http://www.youronlinechoices.eu) (amb base a la UE), o [www.aboutads.info](http://www.aboutads.info) (amb base als EUA).\n\nAlguns programes específics d&#39;exclusió estan disponibles aquí:\n\nGoogle Analytics: [https://tools.google.com/dlpage/gaoptout](https://tools.google.com/dlpage/gaoptout)\n\nÉs important tenir en compte que restringir o deshabilitar l&#39;ús de cookies pot limitar la funcionalitat dels llocs, o evitar que funcionin correctament.\n\n## 4. Actualitzacions d&#39;aquest avís\n\nPer garantir que complim la llei de protecció de dades, podem modificar aquest Avís en qualsevol moment. Publicarem qualsevol canvi realitzat. **Aquesta Política de Cookies s&#39;ha actualitzat per última vegada el 15 d&#39;abril de 2019.**"}], "label": "Política de cookies", "reveal": true}'></div>
