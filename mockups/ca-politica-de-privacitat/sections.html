  <div data-msmt="Article" data-props='{"items": [{"body": "## 0. Dades del responsable\n\nNom de l&#39;empresa: **MSMT Barcelona Music, S.L.**\n\nCIF: **ES B67363986**\n\nAdreça: Passeig de les Lletres 13, 4t 3a; 08221, Terrassa, Barcelona, Espanya\n\nTelèfon: 678 26 23 99\n\nCorreu electrònic: [gdpr@mysheetmusictranscriptions.com](mailto:gdpr@mysheetmusictranscriptions.com)\n\nPersona de contacte: Oriol López\n\n## Quines dades es recullen i es tracten?\n\nA MSMT Barcelona Music, S.L. es recullen i es tracten dades personals com els noms, les adreces personals (de feina o electròniques), els números de telèfon o qualsevol altra dada de caràcter personal dels usuaris web que sigui necessària per a la realització dels tràmits específics que ho requereixin, facilitades mitjançant el web [https://lamevapartitura.cat/](/). La sol·licitud d&#39;un tràmit mitjançant el portal implica l&#39;acceptació expressa i sense reserves de la política de privacitat de dades de caràcter personal que manté MSMT Barcelona Music, S.L., exposada a l&#39;avís legal que s&#39;indiqui al mateix formulari de recollida de dades.\n\nAixí mateix, es poden recollir dades personals a través de l&#39;enviament de missatges als correus electrònics que figuren al web per obtenir informació dels serveis o activitats de MSMT Barcelona Music, S.L.\n\nLa introducció i el registre de les dades de caràcter personal per part de l&#39;Usuari implica l&#39;acceptació i l&#39;autorització expressa a MSMT Barcelona Music, S.L. per a la seva recollida, per a la incorporació als fitxers adequats i per al tractament necessari de les dades personals.\n\nLes dades es tracten amb la confidencialitat necessària en cada cas, i s&#39;adopten les mesures tècniques i organitzatives que es requereixen per garantir-ne la seguretat i evitar qualsevol tractament o ús no autoritzat o que no s&#39;ajusti a la normativa vigent.\n\nLa persona que utilitza els serveis oferts per [https://lamevapartitura.cat/](/) ha de facilitar les dades sol·licitades segons el principi de bona fe. Per tant, no es poden donar dades inexactes o inexistents.\n\n## Amb quines finalitats es tracten les teves dades personals?\n\nEls tractaments de les dades personals poden tenir com a finalitat donar tràmit a les sol·licituds que es facin, gestionar l&#39;enviament d&#39;informació del teu interès, facilitar l&#39;accés a serveis prestats, la sol·licitud d&#39;informació, etc.\n\nEn les comunicacions a les sol·licituds de serveis o d&#39;informació, MSMT Barcelona Music, S.L. informarà, si no ho ha fet abans, sobre les característiques concretes dels tractaments de dades, en compliment de la legislació vigent en matèria de protecció de dades de caràcter personal.\n\n## Quant de temps conservarem les teves dades?\n\nLes dades personals proporcionades es conservaran almenys mentre es mantingui la relació com a usuari del servei, i en tot cas durant el termini en què legalment sigui obligatòria la seva conservació. De manera concreta, per a cada activitat de tractament de dades s&#39;informarà del termini o dels criteris de conservació de les dades. De tota manera, s&#39;adjunta el Registre d&#39;Activitats del Tractament amb tota la informació que correspon:", "image": "img/registro-de-actividades-del-tratamiento.jpg", "alt": "Política de privacitat MSMT Barcelona Music"}, {"body": "L&#39;interessat podrà sol·licitar-ne la supressió, en els casos també previstos legalment.\n\n## Quina és la legitimació per al tractament de les teves dades?\n\nLa base legal per al tractament de les teves dades ha d&#39;estar fonamentada, llevat d&#39;algunes excepcions, en alguna de les previsions següents:\n\n- Consentiment: si has marcat la casella corresponent en un formulari o full d&#39;inscripció / sol·licitud /…, la base legal per enviar informació sobre altres serveis és el teu propi consentiment. Pots retirar-lo en qualsevol moment, en exercici dels drets corresponents.\n- El tractament és necessari per executar un contracte, o un acord i les condicions d&#39;accés a un servei contractat.\n- És necessari per complir una obligació legal.\n\n## A quins destinataris es comunicaran les teves dades?\n\nLes dades es podran comunicar o cedir a tercers quan així estigui expressament informat i existeixi el consentiment de l&#39;interessat.\n\nTambé es podran comunicar, si correspon legalment, per\n\n- Una obligació legal,\n- Quan les dades es tracten en els sistemes d&#39;una tercera empresa, contractada com a **encarregada del tractament**, es podrà informar sobre l&#39;existència i, si escau, la identitat dels encarregats del tractament, amb informació de l&#39;adreça web corresponent.\n\n## Quins són els teus drets?\n\n- Qualsevol persona té dret a obtenir confirmació sobre si a MSMT Barcelona Music, S.L. estem tractant dades personals que la concerneixen, o no.\n- Dret a accedir a les teves dades personals, així com a sol·licitar la rectificació de les dades inexactes o, si escau, sol·licitar-ne la supressió, entre altres motius, quan les dades ja no siguin necessàries per a les finalitats per a les quals es van recollir.\n- Limitar el tractament de dades: en determinades circumstàncies previstes a l&#39;article 18 del RGPD, els interessats poden sol·licitar la limitació del tractament de les seves dades. En aquest cas, únicament les conservarem per exercir o defensar reclamacions.\n- Oposar-te al tractament de les teves dades, llevat de motius legítims imperiosos o per exercir o defensar possibles reclamacions.\n- Dret a la portabilitat: obtenir les teves dades personals en un format estructurat, d&#39;ús comú i de lectura mecànica, i transmetre-les a un altre responsable.\n\n## Com pots exercir els drets?\n\n- Mitjançant un escrit adreçat a MSMT Barcelona Music, S.L. a l&#39;adreça Passeig de les Lletres 13, 4t 3a; 08221, Terrassa, Barcelona,\n- Mitjançant correu electrònic a l&#39;adreça [gdpr@mistranscripcionesmusicales.com](mailto:gdpr@mistranscripcionesmusicales.com), degudament signat mitjançant certificat digital i indicant l&#39;objecte de la teva petició i la justificació.\n\n## Quines vies de reclamació hi ha?\n\nSi consideres que els teus drets no s&#39;han atès adequadament, tens dret a presentar una reclamació davant l&#39;Autoritat de Protecció de Dades competent, és a dir, l&#39;Agència Espanyola de Protecció de Dades, [https://www.aepd.es/](https://www.aepd.es/).\n\n## 2. Transaccions segures\n\nLes comunicacions de dades de caràcter personal a MSMT Barcelona Music, S.L. mitjançant el portal [https://lamevapartitura.cat/](/) es produeixen sempre dins d&#39;un entorn segur.\n\nTota la informació de caràcter confidencial, incloses les dades personals, es manté confidencial gràcies a l&#39;ús del programari de servidor segur (SSL), la qual cosa significa que les dades només poden ser intercanviades entre l&#39;usuari i MSMT Barcelona Music, S.L. i que terceres persones no poden accedir a aquestes dades.\n\n## 3. Política de cookies\n\nUtilitzem cookies per millorar l&#39;accés al nostre lloc. A més, les nostres cookies milloren l&#39;experiència de l&#39;usuari mitjançant el seguiment i l&#39;orientació dels interessos de l&#39;usuari. La informació recopilada és informació de dades digitals com la ubicació geogràfica o l&#39;adreça IP. Pots triar si vols acceptar cookies. La majoria dels navegadors web permeten el control de les cookies enumerades anteriorment a través de la configuració del navegador. Ajustant el teu navegador web pots evitar rebre cookies. No obstant això, això podria fer que els serveis del lloc web no funcionin de manera òptima. El mètode utilitzat per bloquejar les cookies dependrà del navegador web utilitzat. Consulta l&#39;\"Ajuda\" o el menú corresponent del teu navegador web per obtenir instruccions. També pots canviar la configuració en relació amb un tipus específic de cookie. El nostre ús de cookies generalment no està vinculat a informació d&#39;identificació personal al nostre lloc. Per obtenir més informació sobre com utilitzem les cookies, consulta [**la nostra política de cookies**](/politica-de-cookies).\n\n## 4. Legislació aplicable\n\nLa privacitat de tota la informació facilitada, tant la facilitada per l&#39;usuari a través dels diferents formularis de sol·licitud de dades personals com l&#39;accessible a través de [https://lamevapartitura.cat/](/), està regulada pel Reglament (UE) 2016/679 del Parlament Europeu i del Consell, de 27 d&#39;abril de 2016, relatiu a la protecció de les persones físiques pel que fa al tractament de dades personals i a la lliure circulació d&#39;aquestes dades (RGPD); i també per altra legislació vigent en aquesta matèria, com la *Llei Orgànica 3/2018, de 5 de desembre, de protecció de dades personals i garantia dels drets digitals.*\n\n## 5. Modificacions de la Política de Privacitat\n\nPodem modificar la nostra Política de privacitat de tant en tant per motius legals o d&#39;altres. **Aquesta Política de Privacitat es va revisar per última vegada el 15 d&#39;abril de 2019**."}], "label": "Política de privacitat", "reveal": true}'></div>
