  <div data-msmt="Section" data-props='{"title": "Què fem per a segells, mànagers i programadors", "tone": "cream", "id": "serveis", "children": "**Partitures per registrar i editar.** Partitures completes i lead sheets per registrar les obres dels vostres artistes i preparar-ne l&#39;edició.\n\n**Cançoners i material de promoció.** Les cançons d&#39;un disc convertides en un cançoner llest per imprimir o vendre al concert.\n\n**Parts per a gires i substitucions.** Partitures i lead sheets perquè qualsevol músic de reforç aprengui el repertori en pocs dies.\n\n**Arranjaments per a concerts especials.** Vent, corda, cor o orquestra per a una nit única, com els concerts a la catedral o a l&#39;església dels Dolors.\n\n**Tots els formats i entrega ràpida.** PDF, MIDI, Sibelius, Finale, MusicXML, MuseScore i Guitar Pro, amb entrega estàndard en 1-2 dies i revisions incloses."}'></div>
