  <div data-msmt="MediaText" data-props='{"image":"img/band.jpg","alt":"The My Sheet Music Transcriptions team","imageSide":"left","children":"We are a team of 100+ professional musicians with unmatched musical knowledge and extensive tech proficiency. An enthusiastic bunch ready to tackle all-things-notation and help you bring your music to life.\n\nMy Sheet Music Transcriptions’ (MSMT) founder and CEO, Oriol, started as a solo act. Building steadily, never compromising quality for the sake of speed, and learning along the way, lead to opening the French and Spanish-speaking markets. Quickly followed by the Japanese and German sites, reaching an even larger community of fellow musicians.\n\nWith our home base in Catalonia (Terrassa, Barcelona, Spain), our band members are located all around the world. We have skilled Music Specialists ready to help you from various locations on 4 continents (Europe, Asia, and North and South America).\n\nThey will work by your side to fine tune the details of your project, and then, coordinate and communicate it to our team of transcribers, arrangers and composers. Before music is sent back to you, our music editors will take up the baton and ensure that each file meets the highest quality standards."}'></div>

  <div data-msmt="Section" data-props='{"title":"How do we operate?","tone":"cream","children":"Some of us take care of responding your emails and incoming calls. Some others transcribe the music for you. Some others coordinate the whole process.\n\nThere is always an expert transcriber ready to work on your sheet music requests. We make sure that only a proficient jazz pianist works on your jazz piano transcriptions. We make sure that only a proficient fingerstyle guitar player works on your guitar tabs. And that applies to every instrument. We don’t use music transcription software – that doesn’t work at all. We transcribe every note by ear: one after the other. We believe that this is the only way to achieve an accurate, professional result.\n\nWe strive to provide the best quality sheet music transcriptions and customer service; we hope that you love what we are building as much as we do."}'></div>
