  <div data-msmt="Article" data-props='{"items": [{"body": "## 1. OBJECTE\n\nDes de **MSMT BARCELONA MUSIC S.L.,** (d&#39;ara endavant, \"**MSMT**\", \"**nosaltres**\", \"**nostre/s**, **nostra/es**\", \"**ens**\") volem oferir a l&#39;usuari (d&#39;ara endavant, l&#39;\"**Usuari**\", \"**tu**\", \"**a tu**\" i \"**teu/teva**\") una experiència i un servei segurs a la nostra pàgina web **[https://lamevapartitura.cat](/)** (d&#39;ara endavant, \"**MSMT WEB**\").\n\nAmb l&#39;objectiu de garantir una experiència òptima i segura per als nostres usuaris, hem establert els següents \"**Termes i Condicions**\". Aquestes condicions regulen l&#39;accés i l&#39;ús de **MSMT**, i abasten tant els continguts com els serveis disponibles per als usuaris a **MSMT WEB**. És important que tots els usuaris es familiaritzin amb aquestes normes per assegurar un ús adequat i responsable de **MSMT WEB**. No obstant això, l&#39;accés i la utilització de certs continguts i/o serveis pot estar sotmès a determinades condicions específiques.\n\nPer a qualsevol situació o aspecte no cobert explícitament en aquests **Termes i Condicions**, l&#39;[**Avís Legal**](/avis-legal) o la [**Política de Privacitat**](/politica-de-privacitat), la decisió i la gestió correspondran exclusivament a **MSMT**. Aquesta disposició s&#39;aplicarà sens perjudici de les lleis i regulacions vigents.\n\nA més, **MSMT** es reserva el dret de fer canvis o actualitzacions en aquests **Termes i Condicions**. En cas de modificacions substancials, es notificarà a l&#39;**Usuari** amb antelació perquè pugui acceptar-les o rebutjar-les. Tanmateix, si l&#39;**Usuari** continua utilitzant **MSMT** després d&#39;aquests canvis, s&#39;entendrà que els ha acceptat expressament.\n\nEn conseqüència, l&#39;accés i la utilització de **MSMT** implica que l&#39;**Usuari** accepta de manera expressa i sense reserves aquests **Termes i Condicions**, amb la mateixa validesa i eficàcia que qualsevol contracte celebrat per escrit i signat, per la qual cosa, si l&#39;**Usuari** no hi està d&#39;acord, suggerim que no faci ús de l&#39;aplicació i/o de **MSMT WEB**.\n\n## 2. IDENTIFICACIÓ\n\n- **Titular:** MSMT BARCELONA MUSIC, S.L.\n- **Domicili social:** Passeig de les Lletres 13, 4t 3a; 08221, Terrassa, Barcelona (Espanya).\n- **CIF:** B67363986\n- **Dades registrals:** Inscrita al Registre Mercantil de Barcelona, tom 46734, foli 28, full 547901, inscripció 1a.\n- **Correu electrònic:** [info@mysheetmusictranscriptions.com](mailto:info@mysheetmusictranscriptions.com)\n\n## 3. QUÈ ÉS MSMT? QUINS SERVEIS OFEREIX?\n\n**3.1 Què és MSMT?**\n\n**MSMT** és una empresa especialitzada en la transcripció de partitures. Proporciona serveis d&#39;arranjador, copista i transcriptor musical per obtenir les partitures en tots els formats digitals estàndard de la indústria.\n\n**3.2 Funcionalitats de MSMT WEB**\n\nMitjançant programari com Sibelius, Finale, MuseScore i els programes de notació habituals de la indústria, i sempre per mitjà de transcripcions fetes per músics de manera artesanal, **MSMT** ofereix transcripcions i adaptacions 100 % idiomàtiques a l&#39;instrument o conjunt instrumental sol·licitat. En aquest sentit, a través de **MSMT WEB** es pot accedir, entre d&#39;altres, als serveis següents:\n\n- Transcripcions per a piano\n- Transcripcions per a veu i piano\n- Transcripcions de jazz\n- Transcripcions de bandes\n- Tablatures per a guitarra *(inclou digitació)*\n- Tablatures per a baix *(inclou digitació)*\n- Orquestracions\n- Arranjaments\n\nLes diferents transcripcions que ofereix **MSMT WEB** són completament personalitzades, adaptades a les necessitats de l&#39;usuari i elaborades nota a nota manualment per transcriptors professionals. Al llarg del procés de transcripció, l&#39;usuari és informat en tot moment de l&#39;estat de la seva sol·licitud.\n\nA l&#39;efecte dels presents **Termes i Condicions**, s&#39;anomenaran **&#39;Lliurables&#39;** totes les transcripcions, arranjaments, orquestr CTUAL I INDUSTRIAL\n\n**5.1. PROPIETAT INTEL·LECTUAL I INDUSTRIAL SOBRE MSMT WEB**\n\n**MSMT** és titular o, si escau, disposa de les llicències corresponents sobre els drets de propietat intel·lectual, industrial, d&#39;imatge o qualssevol altres d&#39;anàlegs sobre **MSMT WEB**, així com de tots els continguts que s&#39;hi ofereixen, incloent-hi, a títol enunciatiu però no limitatiu, el codi font i de programació, dissenys, estructura de navegació, fotografies, il·lustracions, logotips, marques, grafismes, interfícies o qualsevol altra informació o contingut que hi estigui inclòs.\n\nQueda terminantment prohibit modificar, copiar, distribuir, emmarcar, reproduir, republicar, descarregar, extreure, mostrar, publicar, transferir o vendre, totalment o parcialment, qualsevol contingut de **MSMT WEB** sense l&#39;autorització prèvia i per escrit de **MSMT**. L&#39;**Usuari** únicament disposa d&#39;un dret d&#39;ús no exclusiu, dins d&#39;un àmbit estrictament domèstic, per poder navegar i gaudir dels serveis de **MSMT WEB** d&#39;acord amb els presents **Termes i Condicions** i l&#39;[**Avís Legal**](/avis-legal).\n\n**MSMT** es reserva el dret d&#39;emprendre totes les accions legals que resultin oportunes en cas que l&#39;**Usuari** faci un ús no autoritzat de la informació inclosa a **MSMT WEB**, així com davant de qualsevol dany als drets de propietat intel·lectual de **MSMT**.\n\n**5.2. PROPIETAT INTEL·LECTUAL SOBRE ELS LLIURABLES**\n\nL&#39;**Usuari** manifesta i garanteix que és titular i/o ha obtingut les autoritzacions pertinents per part dels titulars dels drets de propietat intel·lectual de les obres objecte de transcripció, o que aquestes són de domini públic, de manera que l&#39;ús d&#39;aquestes obres i dels **Lliurables** resultants per part de **MSMT** no suposa ni suposarà cap tipus de violació de drets de propietat intel·lectual i/o d&#39;altres drets de naturalesa anàloga que corresponguin a qualsevol tercer. Això inclou el compliment dels termes i condicions d&#39;ús específics autoritzats pels titulars dels drets d&#39;autor o dels acords de llicència subscrits per l&#39;**Usuari** amb tercers.\n\nEn aquest sentit, l&#39;**Usuari** es compromet a complir totes les obligacions legals pertinents en relació amb aquestes obres, incloent-hi, però sense limitar-s&#39;hi, si fos necessari, satisfer les liquidacions de drets d&#39;autor davant les entitats de gestió de drets corresponents. L&#39;**Usuari** respondrà directament, mantenint **MSMT** plenament indemne, davant de qualsevol reclamació judicial o extrajudicial de tercers en relació amb la titularitat i l&#39;ús dels drets de propietat intel·lectual i industrial, i/o d&#39;altres drets anàlegs sobre les obres sol·licitades.\n\nAixí mateix, l&#39;**Usuari** reconeix que **MSMT** ostenta tots els drets de propietat intel·lectual, inclosos, amb caràcter merament enunciatiu i no limitatiu, els de reproducció, transformació, comunicació pública, posada a disposició i distribució, per a tot el món i per a tota la durada legal, sobre els **Lliurables** realitzats a sol·licitud de l&#39;**Usuari**. Per això, l&#39;**Usuari**, llevat d&#39;autorització expressa i per escrit de **MSMT**, es compromet a no utilitzar els **Lliurables** realitzats per **MSMT** amb finalitats comercials, i en queda expressament prohibida la reproducció, distribució, comunicació pública, posada a disposició i transformació amb finalitats lucratives. El que estableix l&#39;apartat anterior no serà aplicable en els casos en què l&#39;**Usuari** sigui el titular de les obres objecte de transcripció. En aquest sentit, **MSMT** autoritza l&#39;**Usuari** i li atorga una llicència a favor seu dels drets de reproducció, transformació, comunicació pública, posada a disposició i distribució sobre els **Lliurables** realitzats a la seva sol·licitud, per a les finalitats que consideri oportunes, i **MSMT** podrà guardar, cedir o llicenciar els **Lliurables** a tercers, o utilitzar-los per al seu propi ús o explotació amb finalitats lucratives sense necessitat d&#39;informar-ne l&#39;**Usuari** ni d&#39;obtenir-ne el consentiment.\n\n## 6. ATENCIÓ A L&#39;USUARI\n\nL&#39;**Usuari** té a la seva disposició el servei d&#39;atenció a l&#39;usuari a través del qual **MSMT** atendrà les consultes, queixes i suggeriments plantejats. Podrà accedir al servei d&#39;atenció al client a través del correu electrònic de contacte següent:\n\n- **Correu electrònic:** info@mysheetmusictranscriptions.com\n\nDonarem resposta a les reclamacions o consultes en el termini més breu possible i, en qualsevol cas, en un termini màxim d&#39;un (1) mes.\n\n## 7. CONFIDENCIALITAT I PROTECCIÓ DE DADES\n\nDe conformitat amb el que disposen el REGLAMENT (UE) 2016/679 DEL PARLAMENT EUROPEU I DEL CONSELL de 27 d&#39;abril de 2016 relatiu a la protecció de les persones físiques pel que fa al tractament de dades personals i a la lliure circulació d&#39;aquestes dades i pel qual es deroga la Directiva 95/46/CE (d&#39;ara endavant, \"**RGPD**\"), la Llei Orgànica 3/2018, de 5 de desembre, de Protecció de Dades Personals i garantia dels drets digitals (\"**LOPDGDD**\") i la Llei 34/2002, d&#39;11 de juliol, de serveis de la societat de la informació i de comerç electrònic (\"**LSSICE**\"), totes les dades de caràcter personal facilitades durant la utilització i l&#39;accés a **MSMT WEB** seran tractades de conformitat amb el que disposa la nostra [**Política de Privacitat**](/politica-de-privacitat), que hauràs de llegir i, si escau, acceptar.\n\n## 8. POLÍTICA D&#39;ENLLAÇOS\n\n**MSMT** no autoritza que es publiqui cap enllaç que redirigeixi a **MSMT WEB** en altres pàgines web que continguin materials, informació o continguts il·lícits, il·legals, degradants, obscens i, en general, que vagin en contra de la llei, la moralitat o l&#39;ordre públic, o de les normes socials generalment acceptades.\n\n**MSMT** no té la facultat ni els mitjans tècnics ni humans per conèixer, controlar o aprovar tota la informació, contingut, productes o serveis facilitats per altres pàgines web que hagin publicat enllaços que redirigeixin a **MSMT WEB**. En conseqüència, **MSMT** no assumirà cap responsabilitat per cap aspecte relacionat amb les pàgines web que publiquin un enllaç web d&#39;aquest tipus.\n\nEn qualsevol cas, **MSMT** es reserva el dret a prohibir enllaços que redirigeixin a **MSMT WEB** i a sol·licitar que s&#39;eliminin quan no compleixin les condicions estipulades en aquest apartat. No obstant això, t&#39;informem que **MSMT WEB** és d&#39;accés privat, per la qual cosa els externs no registrats no hi podran accedir malgrat tenir-ne l&#39;adreça web o similar, llevat que hi accedissin per error tècnic o de manera no autoritzada.\n\n## 9. RESPONSABILITATS DE MSMT\n\n**MSMT** s&#39;obliga a fer que els continguts, dades o informacions relatius als serveis oferts a través de **MSMT WEB** siguin fiables, veraços i exactes. No obstant això, no es farà responsable de les informacions que hagin estat introduïdes, mostrades o modificades pels usuaris o per tercers aliens a **MSMT**. Així doncs, **MSMT** exclou qualsevol responsabilitat pels danys i perjudicis que puguin deure&#39;s a la informació i/o als serveis prestats o subministrats per altres usuaris o tercers.\n\nAixí mateix, **MSMT** declara que ha adoptat totes les mesures necessàries, dins de les seves possibilitats i de l&#39;estat de la tècnica, per garantir el funcionament de **MSMT WEB** i reduir al mínim els errors del sistema, tant des del punt de vista tècnic com dels continguts publicats a **MSMT WEB**.\n\nTanmateix, **MSMT** no serà responsable en cas d&#39;indisponibilitat de **MSMT WEB** o de la impossibilitat d&#39;usar els serveis quan això sigui degut a circumstàncies alienes a **MSMT**, força major o error tècnic en els processos de **MSMT WEB**.\n\n**MSMT** farà tots els esforços comercials i tècnics que estiguin al seu abast per mantenir disponibles els serveis oferts a través de **MSMT WEB**, la qual cosa constitueix una obligació que, no obstant això, no serà aplicable a cap manca de disponibilitat o de rendiment provocada per:\n\n1. Inactivitat temporal de **MSMT WEB** deguda a actualització i/o manteniment tècnic, de la qual s&#39;informarà prèviament mitjançant publicació a la mateixa **MSMT WEB** en un termini màxim de 48 hores, sempre que aquestes circumstàncies siguin conegudes o comunicades a **MSMT** amb un termini d&#39;antelació superior a l&#39;indicat;\n2. Causes alienes al control de **MSMT**, com podrien ser la força major, problemes d&#39;accés a Internet, problemes tecnològics més enllà de la gestió diligent i raonable de **MSMT**, accions o omissions de tercers, etc.\n\nEn tots els casos esmentats, aliens al control i a la diligència deguda per **MSMT**, no hi haurà lloc a cap indemnització d&#39;aquesta a l&#39;**Usuari** per danys i perjudicis o similar.\n\n## 10. SUSPENSIÓ DE MSMT WEB\n\n**MSMT** podrà suspendre, modificar, restringir o interrompre en qualsevol moment l&#39;accés a **MSMT WEB**, amb notificació prèvia o sense, a qui contravingui aquests **Termes i Condicions**, sense possibilitat d&#39;exigir cap indemnització.\n\n## 11. REGLES D&#39;ÚS\n\nNo està permès l&#39;accés o la utilització de **MSMT WEB** amb finalitats il·legals o no autoritzades, amb finalitat econòmica o sense, i en seràs l&#39;únic responsable. En particular, i sense que la llista següent tingui caràcter absolut ni limitatiu, queda prohibit:\n\n1. Els menors d&#39;edat no podran usar els serveis disponibles a través de **MSMT WEB** sense l&#39;autorització prèvia dels seus pares, tutors o representants legals, que seran els únics responsables de tots els actes realitzats a través de **MSMT WEB** pels menors al seu càrrec.\n2. Usar **MSMT WEB** de qualsevol manera que pugui provocar danys, interrupcions, ineficiències o defectes en el seu funcionament o en el dispositiu d&#39;un tercer;\n3. Usar **MSMT WEB** per a la transmissió, instal·lació o publicació de qualsevol virus, troià, cuc, bomba lògica, codi maliciós o altres programes o fitxers perjudicials;\n4. Usar **MSMT WEB** per transmetre material amb finalitats publicitàries o de promoció, inclosos correu brossa, correus electrònics en cadena o similars;\n5. Usar **MSMT WEB** de manera que constitueixi una vulneració dels drets de **MSMT** o de qualsevol tercer;\n6. Usar **MSMT WEB** per transmetre o publicar qualsevol material de caràcter difamatori, ofensiu, racista, denigrant, amenaçador o que pugui causar molèsties a qualsevol altre usuari;\n7. Usar **MSMT WEB** per recollir dades de caràcter personal d&#39;altres usuaris;\n8. Usar **MSMT WEB** de manera il·legal, en contra de la bona fe, la moral i/o l&#39;ordre públic;\n9. Accedir o registrar-se a través de **MSMT WEB** amb una identitat falsa, suplantant tercers o utilitzant un perfil o fent qualsevol altra acció que pugui confondre altres usuaris i **MSMT**;\n10. Accedir sense autorització a qualsevol secció de **MSMT WEB**, a altres sistemes o xarxes connectats a la mateixa, a qualsevol servidor de **MSMT**, o als serveis oferts a través de **MSMT WEB**, mitjançant pirateria o falsificació, extracció de contrasenyes o qualsevol altre mitjà il·legítim;\n11. Trencar, o intentar trencar, les mesures de seguretat o autenticació de **MSMT WEB** o de qualsevol xarxa connectada a aquesta, o les mesures de seguretat o protecció inherents als continguts oferts a **MSMT WEB**;\n12. Dur a terme qualsevol acció que provoqui una saturació desproporcionada o innecessària a la infraestructura de **MSMT WEB** o als sistemes o xarxes de **MSMT**, així com als sistemes i xarxes connectats a **MSMT WEB**;\n13. Impedir el desenvolupament normal de les funcionalitats de **MSMT WEB**, ja sigui alterant o intentant alterar, il·legalment o de qualsevol altra manera, l&#39;accés, la participació o el funcionament d&#39;aquelles, o falsejant-ne el resultat i/o utilitzant mètodes de qualsevol pràctica que atempti contra els alsevol risc de dany o perjudici resultant d&#39;aquest contingut o conducta és responsabilitat exclusiva de l&#39;**Usuari**. Això significa que, en usar els nostres serveis, l&#39;**Usuari** assumeix la responsabilitat completa de qualsevol conseqüència negativa que pugui sorgir a causa de la interacció amb el **Contingut** o les accions d&#39;altres usuaris.\n\n## 15. SISTEMES I ACCÉS\n\n**MSMT WEB** requereix accés a Internet, i l&#39;**Usuari** és responsable de totes les despeses associades a aquesta connexió, incloses les despeses derivades del trànsit de dades, independentment del lloc des d&#39;on l&#39;**Usuari** faci ús de l&#39;aplicació i/o de **MSMT WEB**.\n\n## 16. CLÀUSULA DE SALVAGUARDA\n\nTotes les clàusules dels **Termes i Condicions** s&#39;han d&#39;interpretar de manera independent, sense que la resta de clàusules es vegin afectades en cas que una d&#39;elles hagi estat declarada nul·la per sentència judicial o resolució arbitral ferma. Se substituirà la clàusula o clàusules afectades per una altra o altres que preservin els efectes perseguits pels **Termes i Condicions** de **MSMT.**\n\n## 17. RESOLUCIÓ DE CONTROVÈRSIES\n\nPer a tota qüestió litigiosa relacionada amb aquests **Termes i Condicions** o amb qualsevol dels que en depenguin, i sempre que la legislació ho permeti, serà aplicable la legislació espanyola vigent en el moment del litigi, i seran competents per a la resolució de tots els conflictes derivats o relacionats amb l&#39;ús del present lloc web els Jutjats i Tribunals de Barcelona.\n\nAixí mateix, segons el que estableix el [Reglament (UE) núm. 524/2013 del Parlament Europeu i del Consell, de 21 de maig de 2013, relatiu a la resolució de litigis en línia en matèria de consum](https://www.boe.es/doue/2013/165/L00001-00012.pdf), en cas de controvèrsia, si l&#39;**Usuari** ho desitja, podrà acudir a la \"*Plataforma de Resolució de Controvèrsies de la Comissió*\" per intentar resoldre extrajudicialment qualsevol controvèrsia que es derivi de la prestació dels serveis per part de **MSMT**, a través de l&#39;enllaç següent: [http://ec.europa.eu/consumers/odr/](http://ec.europa.eu/consumers/odr/). En tot cas, per presentar reclamacions sobre l&#39;ús dels nostres serveis, l&#39;**Usuari** pot adreçar-se per correu a l&#39;adreça electrònica o física indicada a l&#39;apartat \"*Identificació*\", i ens comprometem a buscar en tot moment una solució amistosa al conflicte.\n\n## 18. CLÀUSULA DE CONDICIONS ESPECÍFIQUES PER A USUARIS ARTISTES O PROFESSIONALS\n\nEn certes circumstàncies, i reconeixent la naturalesa única de les activitats i necessitats dels usuaris que s&#39;identifiquen com a artistes o professionals, **MSMT** es reserva el dret d&#39;establir condicions específiques per a aquests usuaris. Aquestes condicions especials estaran dissenyades per atendre les particularitats inherents a les seves activitats professionals o artístiques.\n\nAquestes condicions especials podran ser negociades i acordades de manera individual amb cada usuari artista o professional, segons les característiques i els requeriments específics de la seva activitat. Aquestes condicions poden incloure, però no es limiten a, termes d&#39;ús exclusius, serveis personalitzats, requisits de propietat intel·lectual i altres consideracions rellevants per al seu àmbit professional o artístic.\n\nCada acord individual serà documentat per escrit i formarà part integrant del contracte entre l&#39;usuari artista o professional i **MSMT**. Aquests termes específics s&#39;entendran complementaris i, en cas de conflicte, prevaldran sobre aquests **Termes i Condicions** de **MSMT**.\n\n## 19. ALTRES TEXTOS LEGALS\n\nEls presents Termes i Condicions estan complementats per la [**Política de Privacitat**](/politica-de-privacitat) i l&#39;[**Avís Legal**](/avis-legal). Tot això sens perjudici de qualsevol altra regulació o text legal que sigui necessari afegir, complementar o tenir en compte en compliment del que disposi la legislaci
