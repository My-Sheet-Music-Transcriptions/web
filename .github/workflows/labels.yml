name: Scope labels

# Labels every PR by what it touches, so the blast radius is visible at a glance:
#   content      – pages, data, mockups (paths without a code owner: merges on green CI)
#   engineering  – anything else (needs an approval from @My-Sheet-Music-Transcriptions/core)
# A PR can carry both. Runs on pull_request_target so it can label PRs from any branch; it never checks
# out or runs the PR's code, it only reads the list of changed files through the API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Scope labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Keep in sync with the unowned paths at the end of .github/CODEOWNERS.
            const CONTENT_PATHS = ['content/', 'mockups/', 'docs/migration/', 'src/design-system/artifact.json']
            const LABELS = {
              content: { color: '239c90', description: 'Touches pages, data or mockups only (no code owner)' },
              engineering: { color: 'b8571c', description: 'Touches code, config or tests: needs a core approval' },
            }
            const { owner, repo } = context.repo
            const pull_number = context.payload.pull_request.number
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 })
            const paths = files.flatMap((f) => [f.filename, f.previous_filename].filter(Boolean))
            const isContent = (p) => CONTENT_PATHS.some((c) => (c.endsWith('/') ? p.startsWith(c) : p === c))
            const want = new Set()
            if (paths.some(isContent)) want.add('content')
            if (paths.some((p) => !isContent(p))) want.add('engineering')

            for (const [name, spec] of Object.entries(LABELS)) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name })
              } catch {
                await github.rest.issues.createLabel({ owner, repo, name, ...spec })
              }
            }
            const current = new Set(context.payload.pull_request.labels.map((l) => l.name))
            const add = [...want].filter((l) => !current.has(l))
            const remove = Object.keys(LABELS).filter((l) => current.has(l) && !want.has(l))
            if (add.length) await github.rest.issues.addLabels({ owner, repo, issue_number: pull_number, labels: add })
            for (const name of remove) await github.rest.issues.removeLabel({ owner, repo, issue_number: pull_number, name })
            core.info(`${paths.length} files → ${[...want].join(', ') || 'no label'}`)
