name: External links (weekly)

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          SITE_LOCALE: en
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir ${{ github.workspace }}/dist/client --accept 200..=299,403,429 'dist/client/**/*.html'
          fail: false
